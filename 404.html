<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fc">
  <title>Siden finnes ikke – Støtteklang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f8fc;color:#10182c;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(620px,100%);padding:52px;border:1px solid #dfe4ee;border-radius:24px;background:#fff;box-shadow:0 22px 60px rgba(17,29,61,.11)}.logo{width:48px;height:48px;display:grid;place-items:center;margin-bottom:58px;border-radius:13px;background:#111d3d;color:#fff;font-weight:800}small{color:#3157e7;font-weight:800;letter-spacing:.12em}h1{margin:16px 0;font-size:clamp(2.6rem,8vw,5rem);line-height:.96;letter-spacing:-.06em}p{max-width:460px;color:#68738b;line-height:1.65}a{display:inline-flex;margin-top:24px;padding:14px 18px;border-radius:11px;background:#3157e7;color:#fff;text-decoration:none;font-weight:700}@media(max-width:600px){.card{padding:32px}.logo{margin-bottom:42px}}
  </style>
</head>
<body><main class="card"><div class="logo">SK</div><small>FEIL 404</small><h1>Her var det ingen støtteordning.</h1><p>Lenken kan være gammel, eller siden kan ha blitt flyttet. Gå tilbake til oversikten og fortsett søket.</p><a href="./">Til Støtteklang</a></main></body>
</html>
