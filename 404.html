<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f2e9">
  <title>Siden finnes ikke – Støtteklang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:#171717;background:linear-gradient(rgba(23,23,23,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(23,23,23,.045) 1px,transparent 1px),radial-gradient(circle at 85% 8%,rgba(104,71,255,.15),transparent 28%),#f7f2e9;background-size:36px 36px,36px 36px,auto,auto;font-family:Inter,sans-serif}.card{position:relative;width:min(660px,100%);padding:52px;overflow:hidden;border:3px solid #171717;border-radius:18px 42px 18px 18px;background:#fffdf8;box-shadow:10px 12px 0 #171717}.card:after{content:"404";position:absolute;right:-20px;bottom:-45px;color:#6847ff;font-family:Archivo,sans-serif;font-size:11rem;font-weight:900;line-height:1;opacity:.12}.logo{width:52px;height:52px;display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:58px;border:3px solid #171717;border-radius:14px;background:#6847ff}.logo i{display:block;width:5px;border-radius:99px;background:#ffd447}.logo i:nth-child(1){height:18px}.logo i:nth-child(2){height:31px}.logo i:nth-child(3){height:22px}small{color:#6847ff;font-weight:900;letter-spacing:.16em}h1{max-width:520px;margin:16px 0;font-family:Archivo,sans-serif;font-size:clamp(3rem,9vw,5.6rem);font-weight:900;line-height:.88;letter-spacing:-.07em}p{max-width:460px;color:#5e5952;line-height:1.65}a{position:relative;z-index:2;display:inline-flex;margin-top:24px;padding:14px 18px;border:2px solid #171717;border-radius:11px;background:#6847ff;color:white;box-shadow:5px 6px 0 #171717;text-decoration:none;font-weight:800}@media(max-width:600px){.card{padding:32px}.logo{margin-bottom:42px}.card:after{font-size:8rem}}
  </style>
</head>
<body><main class="card"><div class="logo" aria-label="Støtteklang"><i></i><i></i><i></i></div><small>FEIL 404</small><h1>Her var det ingen støtteordning.</h1><p>Lenken kan være gammel, eller siden kan ha blitt flyttet. Gå tilbake til oversikten og fortsett søket.</p><a href="./">Til Støtteklang</a></main></body>
</html>
